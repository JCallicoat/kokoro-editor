[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-editor"
version = "0.1.0"
description = "A simple text editor with built-in Kokoro text-to-speech playback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "sounddevice",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Editors",
]

[project.gui-scripts]
kokoro-editor = "kokoro_editor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_editor"]
