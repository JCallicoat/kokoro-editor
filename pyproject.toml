[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-editor"
version = "1.0.1"
description = "A simple text editor with built-in Kokoro text-to-speech playback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "sounddevice",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Editors",
]

[dependency-groups]
test = ["pytest>=8"]

[project.gui-scripts]
kokoro-editor = "kokoro_editor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["kokoro_editor"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Ruff's default rules, except:
ignore = [
    # Audio device and stream errors come in many types (PortAudio,
    # sounddevice); they're shown to the user or, when closing a stream,
    # safely ignored.
    "BLE001",  # blind except
    "S110",    # try-except-pass
]
